{% extends "base.html" %}
{% block content %}
<div class="container pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="content-card">
                <div class="card-title mb-4 border-bottom pb-3">
                    <span><i class="fas fa-building"></i>{{ page_title }}</span>
                </div>

                {% if company %}
                <form action="/platform/companies/{{ company.id }}" method="POST">
                {% else %}
                <form action="/platform/companies" method="POST">
                {% endif %}
{{ csrf_input }}

                    <!-- 기본 정보 -->
                    <h6 class="fw-semibold text-muted mb-3">기본 정보</h6>
                    <div class="row g-3">
                        <div class="col-lg-8">
                            <label class="form-label fw-semibold small">회사명 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ company.name if company else '' }}" required>
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">사업자번호</label>
                            <input type="text" name="business_no" class="form-control"
                                   value="{{ company.business_no if company else '' }}"
                                   placeholder="000-00-00000">
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label fw-semibold small">대표자</label>
                            <input type="text" name="representative" class="form-control"
                                   value="{{ company.representative if company else '' }}">
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label fw-semibold small">업태</label>
                            <input type="text" name="biz_type" class="form-control"
                                   value="{{ company.biz_type if company else '' }}">
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label fw-semibold small">종목</label>
                            <input type="text" name="biz_item" class="form-control"
                                   value="{{ company.biz_item if company else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold small">주소</label>
                            <input type="text" name="address" class="form-control"
                                   value="{{ company.address if company else '' }}">
                        </div>
                        {% if company %}
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">상태</label>
                            <select name="status" class="form-select">
                                <option value="active" {{ 'selected' if company.status == 'active' else '' }}>활성</option>
                                <option value="inactive" {{ 'selected' if company.status == 'inactive' else '' }}>비활성</option>
                            </select>
                        </div>
                        {% endif %}
                    </div>

                    <!-- 담당자 -->
                    <h6 class="fw-semibold text-muted mb-3 mt-4">담당자 정보</h6>
                    <div class="row g-3">
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">담당자명</label>
                            <input type="text" name="contact_name" class="form-control"
                                   value="{{ company.contact_name if company else '' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">연락처</label>
                            <input type="text" name="contact_phone" class="form-control"
                                   value="{{ company.contact_phone if company else '' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">이메일</label>
                            <input type="email" name="contact_email" class="form-control"
                                   value="{{ company.contact_email if company else '' }}">
                        </div>
                    </div>

                    <!-- 계약 정보 -->
                    <h6 class="fw-semibold text-muted mb-3 mt-4">계약 정보</h6>
                    <div class="row g-3">
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">계약 시작일</label>
                            <input type="date" name="contract_start" class="form-control"
                                   value="{{ company.contract_start if company else '' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">계약 종료일</label>
                            <input type="date" name="contract_end" class="form-control"
                                   value="{{ company.contract_end if company else '' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">계약금액 (원)</label>
                            <input type="number" name="contract_amount" class="form-control"
                                   value="{{ company.contract_amount if company else '' }}"
                                   min="0" step="1">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold small">계약 내용</label>
                            <textarea name="contract_content" class="form-control" rows="4">{{ company.contract_content if company else '' }}</textarea>
                        </div>
                    </div>

                    <!-- 근무 스케줄 -->
                    <h6 class="fw-semibold text-muted mb-3 mt-4">근무 스케줄</h6>
                    <div class="row g-3">
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">출근 시간</label>
                            <input type="time" name="start_time" class="form-control"
                                   value="{{ schedule.start_time if schedule else '09:00' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">퇴근 시간</label>
                            <input type="time" name="end_time" class="form-control"
                                   value="{{ schedule.end_time if schedule else '18:00' }}">
                        </div>
                        <div class="col-lg-4">
                            <label class="form-label fw-semibold small">휴게 시간 (분)</label>
                            <input type="number" name="break_min" class="form-control"
                                   value="{{ schedule.break_min if schedule else 60 }}"
                                   min="0" max="480" step="10">
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% if company %}/platform/companies/{{ company.id }}{% else %}/platform/companies{% endif %}"
                           class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i>취소
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>저장
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
