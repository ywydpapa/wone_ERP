<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근로계약서 - {{ employee_name }}</title>
<link rel="stylesheet" href="/static/css/doc-print.css?v=2">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    font-size: 13px;
    color: #111;
    background: #fff;
    padding: 20px;
}
.contract-doc { max-width: 800px; }
.print-ctrl { max-width: 800px; }

@media print {
    body { padding: 0; }
    .print-ctrl { display: none !important; }
    .contract-doc-table .lbl, .sign-summary .lbl {
        background: #eee !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    @page { size: A4 portrait; margin: 15mm; }
}
</style>
</head>
<body class="std-print">
{% include "common/print_watermark.html" %}

{{ contract.body_html | safe }}

<table class="sign-summary">
    <tr>
        <td class="lbl">사업주 서명</td>
        <td>{{ contract.employer_signed_at or '(서명 전)' }}</td>
        <td class="lbl">근로자 서명</td>
        <td>{{ contract.worker_sign_name or '(서명 전)' }} {% if contract.worker_signed_at %}&middot; {{ contract.worker_signed_at }}{% endif %}</td>
    </tr>
    <tr>
        <td class="lbl">문서 해시</td>
        <td colspan="3" class="hash">{{ contract.body_hash }}</td>
    </tr>
</table>

<div class="print-ctrl">
    <button class="btn-close-tab" onclick="window.close()">닫기</button>
    <button class="btn-print" onclick="window.print()">인쇄 / PDF 저장</button>
</div>

</body>
</html>
