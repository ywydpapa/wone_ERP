<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근로계약서 - {{ employee_name }}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    font-size: 13px;
    color: #111;
    background: #fff;
    padding: 20px;
}
.contract-doc { max-width: 800px; margin: 0 auto; }
.contract-doc-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: 4px; }
.contract-doc-intro { margin-bottom: 14px; line-height: 1.7; }
.contract-doc-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.contract-doc-table caption { text-align: left; font-weight: 700; padding: 4px 2px; caption-side: top; }
.contract-doc-table td, .contract-doc-table th { border: 1px solid #999; padding: 7px 10px; vertical-align: middle; }
.contract-doc-table .lbl { background: #f0f0f0; font-weight: 600; width: 22%; white-space: nowrap; }
.contract-doc-notice { font-size: 12px; color: #555; margin-bottom: 16px; line-height: 1.6; }

.sign-summary { width: 100%; border-collapse: collapse; margin-top: 16px; }
.sign-summary td { border: 1px solid #999; padding: 8px 10px; }
.sign-summary .lbl { background: #f0f0f0; font-weight: 600; width: 16%; }
.sign-summary .hash { word-break: break-all; }

.print-ctrl { max-width: 800px; margin: 16px auto 0; display: flex; gap: 8px; justify-content: flex-end; }
.btn-print, .btn-close-tab { padding: 6px 18px; font-size: 13px; border: 1px solid #555; background: #fff; cursor: pointer; border-radius: 3px; }
.btn-close-tab { border-color: #ccc; background: #f5f5f5; }

@media print {
    body { padding: 0; }
    .print-ctrl { display: none !important; }
    .contract-doc-table .lbl, .sign-summary .lbl {
        background: #eee !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    @page { size: A4 portrait; margin: 15mm; }
}
</style>
</head>
<body>
{% include "common/print_watermark.html" %}

{{ contract.body_html | safe }}

<table class="sign-summary">
    <tr>
        <td class="lbl">사업주 서명</td>
        <td>{{ contract.employer_signed_at or '(서명 전)' }}</td>
        <td class="lbl">근로자 서명</td>
        <td>{{ contract.worker_sign_name or '(서명 전)' }} {% if contract.worker_signed_at %}&middot; {{ contract.worker_signed_at }}{% endif %}</td>
    </tr>
    <tr>
        <td class="lbl">문서 해시</td>
        <td colspan="3" class="hash">{{ contract.body_hash }}</td>
    </tr>
</table>

<div class="print-ctrl">
    <button class="btn-close-tab" onclick="window.close()">닫기</button>
    <button class="btn-print" onclick="window.print()">인쇄 / PDF 저장</button>
</div>

</body>
</html>
