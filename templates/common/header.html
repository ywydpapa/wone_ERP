<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('WONE ERP') }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/style.css">

    <script>
    (function(){
        var font = localStorage.getItem('a11y_font') || 'normal';
        var contrast = localStorage.getItem('a11y_contrast') === '1';
        var el = document.documentElement;
        if (font === 'large') el.classList.add('a11y-large');
        else if (font === 'xlarge') el.classList.add('a11y-xlarge');
        if (contrast) el.classList.add('a11y-contrast');
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
