<div class="modal fade profile-modal" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-2 align-items-start">
                <div class="d-flex align-items-center gap-3 w-100">
                    <img id="prof-avatar" src="" alt="" class="rounded-circle" width="52" height="52">
                    <div class="flex-grow-1">
                        <div class="fw-bold fs-6" id="prof-name"></div>
                        <div class="small text-muted" id="prof-meta"></div>
                        <div class="small text-muted mt-1 d-none" id="prof-phone">
                            <i class="fas fa-phone me-1 text-07"></i>
                            <span id="prof-phone-val"></span>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0 pb-2 px-3">
                <div class="small text-muted mb-2 fw-semibold chat-label">대화</div>
                <div id="chat-area" class="chat-area"></div>
            </div>
            <div class="modal-footer border-0 pt-1 px-3 pb-3 d-flex gap-2">
                <input type="hidden" id="prof-to">
                <input type="text" id="prof-msg-body" class="form-control form-control-sm rounded-pill px-3"
                       placeholder="메시지를 입력하세요...">
                <button type="button" class="btn btn-primary btn-sm" id="profSendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
