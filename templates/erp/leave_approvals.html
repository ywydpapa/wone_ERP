{% extends "base.html" %}
{% block content %}
<div class="container pb-5 mt-4">
    <div class="content-card">
        <div class="card-title mb-3">
            <span>휴가 신청 목록</span>
            <span class="status-badge status-wait ms-2">대기 {{ wait_cnt }}건</span>
        </div>
        {% if docs %}
        <div class="table-responsive">
            <table class="table table-hover align-middle small">
                <thead class="table-light">
                    <tr>
                        <th>제목</th><th>부서</th><th>마감</th><th>상태</th><th class="col-approve">처리</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in docs %}
                    <tr>
                        <td>
                            <a href="/erp_doc/{{ d.id }}" class="text-dark text-decoration-none fw-semibold">{{ d.title }}</a>
                        </td>
                        <td class="text-muted">{{ d.dept or '-' }}</td>
                        <td class="text-muted">{{ d.due_label or '-' }}</td>
                        <td><span class="status-badge {{ d.status_class }}">{{ d.status_label }}</span></td>
                        <td><a href="/erp_doc/{{ d.id }}" class="btn btn-outline-primary btn-sm px-2">상세</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="text-center py-5">
            <i class="fas fa-umbrella-beach fa-3x text-muted opacity-50 mb-3"></i>
            <p class="text-muted mb-0">처리할 휴가 신청이 없습니다.</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
