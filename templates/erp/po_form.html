{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="poForm" action="/purchase-orders/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="po_id" value="{{ po.id if po else 0 }}">
                <input type="hidden" name="line_nums" id="lineNums" value="">

                <div class="form-grid cols-2">
                    <label for="poPartner" class="req">거래처</label>
                    <div class="fg-field">
                        <select name="partner_id" id="poPartner" class="form-select" required>
                            <option value="">선택</option>
                            {% for p in partners %}
                            <option value="{{ p.id }}"
                                {{ 'selected' if (po.partner_id if po else pre_partner) == p.id else '' }}>
                                [{{ p.code }}] {{ p.name }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="small mt-1" id="partnerWarn"></div>
                    </div>
                    <label for="poContact">담당자</label>
                    <div class="fg-field">
                        <select id="poContact" name="contact_id" class="form-select">
                            <option value="">선택 안 함</option>
                        </select>
                    </div>
                    <label for="poDate" class="req">발주일</label>
                    <div class="fg-field"><input type="date" name="po_date" id="poDate" class="form-control" value="{{ po.po_date if po else today }}" required></div>
                    <label for="poDelivery">납기일</label>
                    <div class="fg-field"><input type="date" name="delivery_date" id="poDelivery" class="form-control" value="{{ po.delivery_date if po else '' }}"></div>
                    <label for="poNotes">비고</label>
                    <div class="fg-field"><textarea name="notes" id="poNotes" class="form-control" rows="1">{{ po.notes if po else '' }}</textarea></div>
                </div>

                <h6 class="fw-semibold mb-2">품목 라인</h6>
                <div class="table-responsive mb-3">
                    <table class="grid-table" id="lineTable">
                        <thead>
                            <tr>
                                <th class="no">No</th>
                                <th>품목</th>
                                <th class="w-md col-opt">단위</th>
                                <th class="w-qty">수량</th>
                                <th class="w-amt">단가</th>
                                <th class="w-amt">금액</th>
                                <th class="row-act"></th>
                            </tr>
                        </thead>
                        <tbody id="lineBody">
                        </tbody>
                        <tfoot>
                            <tr class="total">
                                <td colspan="5" class="text-center">합계</td>
                                <td class="num" id="totalAmount">0</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="grid-foot">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-action="addLine"><i class="fas fa-plus me-1"></i>품목 추가</button>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/purchase-orders" class="btn btn-outline-secondary">취소</a>
                    <span class="ab-msg" id="poFormMsg" role="alert"></span>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var lineSeq = 0;
var itemCache = [];

function addLine(itemId, itemCode, itemName, unit, qty, price) {
    lineSeq++;
    var n = lineSeq;
    var displayCode = itemCode || '';
    var displayName = itemName || '';
    var displayUnit = unit || '';
    var displayQty = qty || 1;
    var displayPrice = price || 0;
    var lineAmt = displayQty * displayPrice;

    var tr = document.createElement('tr');
    tr.id = 'line_' + n;
    tr.innerHTML =
        '<td class="no">' + n + '</td>' +
        '<td class="inp position-relative">' +
            '<input type="hidden" name="item_id_' + n + '" id="itemId_' + n + '" value="' + (itemId || '') + '">' +
            '<input type="text" class="form-control" id="itemSearch_' + n + '" placeholder="품목 검색" value="' + (displayCode ? displayCode + ' ' + displayName : '') + '" autocomplete="off" onfocus="showDropdown(' + n + ')" oninput="searchItem(' + n + ')">' +
            '<div class="dropdown-menu w-100 dropdown-scroll" id="itemDrop_' + n + '"></div>' +
        '</td>' +
        '<td class="col-opt"><span id="unitLabel_' + n + '">' + displayUnit + '</span></td>' +
        '<td class="inp"><input type="text" name="qty_' + n + '" class="form-control amt qty" inputmode="numeric" value="' + amt.fmt(displayQty) + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="inp"><input type="text" name="price_' + n + '" class="form-control amt price" inputmode="numeric" value="' + amt.fmt(displayPrice) + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="num" id="amt_' + n + '">' + amt.fmt(lineAmt) + '</td>' +
        '<td class="row-act"><button type="button" class="btn btn-sm" data-action="removeLine" data-line="' + n + '" tabindex="-1" title="삭제"><i class="fas fa-times"></i></button></td>';
    document.getElementById('lineBody').appendChild(tr);
    calcTotal();
}

function removeLine(n) {
    var el = document.getElementById('line_' + n);
    if (el) el.remove();
    calcTotal();
}

function calcLine(n) {
    var qty = amt.val(document.querySelector('[name=qty_' + n + ']'));
    var price = amt.val(document.querySelector('[name=price_' + n + ']'));
    document.getElementById('amt_' + n).textContent = amt.fmt(qty * price);
    calcTotal();
}

function calcTotal() {
    var total = 0;
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var amtEl = tr.querySelector('[id^=amt_]');
        if (amtEl) total += parseInt(amtEl.textContent.replace(/,/g, '')) || 0;
    });
    document.getElementById('totalAmount').textContent = amt.fmt(total);

    var nums = [];
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var id = tr.id.replace('line_', '');
        nums.push(id);
    });
    document.getElementById('lineNums').value = nums.join(',');
}

var searchTimer;
function searchItem(n) {
    clearTimeout(searchTimer);
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length < 1) { hideDropdown(n); return; }
    searchTimer = setTimeout(function() {
        fetch('/api/items/search?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dd = document.getElementById('itemDrop_' + n);
                dd.innerHTML = '';
                data.forEach(function(item) {
                    var a = document.createElement('a');
                    a.className = 'dropdown-item small';
                    a.href = '#';
                    a.textContent = item.item_code + ' ' + item.item_name + ' (' + item.unit + ')';
                    a.onclick = function(e) {
                        e.preventDefault();
                        selectItem(n, item);
                    };
                    dd.appendChild(a);
                });
                if (data.length > 0) dd.classList.add('show');
                else dd.classList.remove('show');
            });
    }, 200);
}

function selectItem(n, item) {
    document.getElementById('itemId_' + n).value = item.id;
    document.getElementById('itemSearch_' + n).value = item.item_code + ' ' + item.item_name;
    document.getElementById('unitLabel_' + n).textContent = item.unit;
    document.getElementById('line_' + n).dataset.base = item.unit_price;
    hideDropdown(n);
    applyRate(n);
}

// 발주일 기준 유효한 거래처별 단가 우선, 없으면 입고단가 그룹 조정률. 기본단가는 행에 보관, 거래처 변경 시 재계산
var rate = 0, prices = {};
function applyRate(n) {
    var tr = document.getElementById('line_' + n);
    if (tr.dataset.base === undefined) return;
    var fixed = prices[document.getElementById('itemId_' + n).value];
    amt.set(tr.querySelector('[name=price_' + n + ']'), fixed !== undefined ? fixed : Math.round(tr.dataset.base * (1 + rate / 100)));
    calcLine(n);
}

var poPartner = document.getElementById('poPartner');
var poContact = formKit.contactPicker(document.getElementById('poContact'), 'buy');
var keepContactId = {{ (po.contact_id if po and po.contact_id else 0)|tojson }};
function setRate() {
    var pid = poPartner.value;
    var on = document.getElementById('poDate').value;
    var priced = pid ? fetch('/api/partners/' + pid + '/prices?kind=buy&on=' + on).then(function(r) { return r.json(); }) : Promise.resolve({});
    Promise.all([lookup.load('partner'), priced]).then(function(res) {
        var p = res[0].find(function(r) { return String(r.id) === pid; });
        rate = p ? p.buy_rate : 0;
        prices = res[1];
        document.querySelectorAll('#lineBody tr').forEach(function(tr) { applyRate(tr.id.replace('line_', '')); });
        formKit.partnerWarn(document.getElementById('partnerWarn'), p);
        poContact.load(pid, keepContactId);
        keepContactId = null;
    });
}
poPartner.addEventListener('change', setRate);
document.getElementById('poDate').addEventListener('change', function() {
    if (!poPartner.value) return;
    fetch('/api/partners/' + poPartner.value + '/prices?kind=buy&on=' + this.value).then(function(r) { return r.json(); }).then(function(d) {
        prices = d;
        document.querySelectorAll('#lineBody tr').forEach(function(tr) { applyRate(tr.id.replace('line_', '')); });
    });
});
if (poPartner.value) setRate();

function showDropdown(n) {
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length >= 1) searchItem(n);
}

function hideDropdown(n) {
    document.getElementById('itemDrop_' + n).classList.remove('show');
}

document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (el && el.dataset.action === 'addLine') { addLine(); return; }
    if (el && el.dataset.action === 'removeLine') { removeLine(parseInt(el.dataset.line)); return; }
    document.querySelectorAll('.dropdown-menu.show').forEach(function(dd) {
        if (!dd.parentElement.contains(e.target)) dd.classList.remove('show');
    });
});

document.addEventListener('change', function(e) {
    var el = e.target.closest('[data-action="calcLine"]');
    if (el) calcLine(parseInt(el.dataset.line));
});

var poForm = document.getElementById('poForm');
poForm.addEventListener('submit', function() {
    calcTotal();
});

// Enter 암묵적 제출 차단
poForm.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
    e.preventDefault();
});

var poFormDirty = formKit.trackDirty(poForm);
formKit.ajaxSubmit(poForm, { dirty: poFormDirty });

// 기존 라인 로드 (수정 모드)
{% if po and po.lines %}
{% for line in po.lines %}
addLine({{ line.item_id }}, '{{ line.item_code }}', '{{ line.item_name }}', '{{ line.unit }}', {{ line.quantity }}, {{ line.unit_price }});
{% endfor %}
{% else %}
addLine();
{% endif %}
</script>
{% endblock %}
