{% extends "base.html" %}
{% block styles %}
<style>
.pr-no { width: 50px; }
.pr-item { width: 280px; }
.pr-qty { width: 100px; }
.pr-price { width: 130px; }
.pr-amount { width: 130px; }
.pr-notes { width: 160px; }
.pr-action { width: 50px; }
</style>
{% endblock %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="content-card">
                    <div class="card-title mb-4 border-bottom pb-3">
                        <span><i class="fas fa-clipboard-list"></i>{{ page_title }}</span>
                    </div>

                    <form id="prForm" action="/purchase-requisitions/save" method="POST">
{{ csrf_input }}
                        <input type="hidden" name="pr_id" value="{{ pr.id if pr else 0 }}">
                        <input type="hidden" name="line_nums" id="lineNums" value="">

                        <div class="row g-3 mb-4">
                            <div class="col-lg-4">
                                <label class="form-label fw-semibold small">요청일 <span class="text-danger">*</span></label>
                                <input type="date" name="request_date" class="form-control"
                                       value="{{ pr.request_date if pr else today }}" required>
                            </div>
                            <div class="col-lg-4">
                                <label class="form-label fw-semibold small">필요일</label>
                                <input type="date" name="need_date" class="form-control"
                                       value="{{ pr.need_date if pr else '' }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">비고</label>
                                <textarea name="notes" class="form-control" rows="2">{{ pr.notes if pr else '' }}</textarea>
                            </div>
                        </div>

                        <h6 class="fw-semibold mb-3"><i class="fas fa-list me-1"></i>요청 품목</h6>
                        <div class="table-responsive mb-3">
                            <table class="table table-bordered align-middle small" id="lineTable">
                                <thead class="table-light">
                                    <tr>
                                        <th class="pr-no">No</th>
                                        <th class="pr-item">품목</th>
                                        <th class="pr-qty">수량</th>
                                        <th class="pr-price">예상단가</th>
                                        <th class="pr-amount">예상금액</th>
                                        <th class="pr-notes">비고</th>
                                        <th class="pr-action"></th>
                                    </tr>
                                </thead>
                                <tbody id="lineBody">
                                </tbody>
                                <tfoot>
                                    <tr class="table-light fw-semibold">
                                        <td colspan="4" class="text-end">합계</td>
                                        <td class="text-end" id="totalAmount">0</td>
                                        <td colspan="2"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary mb-4" data-action="addLine">
                            <i class="fas fa-plus me-1"></i>품목 추가
                        </button>

                        <hr class="my-4">
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="/purchase-requisitions" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i>취소
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>저장
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var lineSeq = 0;

function addLine(itemId, itemCode, itemName, qty, price, notes) {
    lineSeq++;
    var n = lineSeq;
    var displayQty = qty || 1;
    var displayPrice = price || 0;
    var amt = displayQty * displayPrice;

    var tr = document.createElement('tr');
    tr.id = 'line_' + n;
    tr.innerHTML =
        '<td class="text-center">' + n + '</td>' +
        '<td>' +
            '<input type="hidden" name="item_id_' + n + '" id="itemId_' + n + '" value="' + (itemId || '') + '">' +
            '<div class="input-group input-group-sm">' +
                '<input type="text" class="form-control" name="item_name_' + n + '" id="itemSearch_' + n + '" placeholder="품목 검색 또는 직접 입력" value="' + (itemName || '') + '" autocomplete="off" onfocus="showDropdown(' + n + ')" oninput="searchItem(' + n + ')">' +
                '<div class="dropdown-menu w-100 dropdown-scroll" id="itemDrop_' + n + '"></div>' +
            '</div>' +
        '</td>' +
        '<td><input type="number" name="qty_' + n + '" class="form-control form-control-sm text-end" min="1" value="' + displayQty + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td><input type="number" name="price_' + n + '" class="form-control form-control-sm text-end" min="0" value="' + displayPrice + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="text-end fw-semibold" id="amt_' + n + '">' + amt.toLocaleString() + '</td>' +
        '<td><input type="text" name="notes_' + n + '" class="form-control form-control-sm" value="' + (notes || '') + '"></td>' +
        '<td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" data-action="removeLine" data-line="' + n + '"><i class="fas fa-trash"></i></button></td>';
    document.getElementById('lineBody').appendChild(tr);
    calcTotal();
}

function removeLine(n) {
    var el = document.getElementById('line_' + n);
    if (el) el.remove();
    calcTotal();
}

function calcLine(n) {
    var qty = parseInt(document.querySelector('[name=qty_' + n + ']').value) || 0;
    var price = parseInt(document.querySelector('[name=price_' + n + ']').value) || 0;
    document.getElementById('amt_' + n).textContent = (qty * price).toLocaleString();
    calcTotal();
}

function calcTotal() {
    var total = 0;
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var amtEl = tr.querySelector('[id^=amt_]');
        if (amtEl) total += parseInt(amtEl.textContent.replace(/,/g, '')) || 0;
    });
    document.getElementById('totalAmount').textContent = total.toLocaleString();

    var nums = [];
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        nums.push(tr.id.replace('line_', ''));
    });
    document.getElementById('lineNums').value = nums.join(',');
}

var searchTimer;
function searchItem(n) {
    clearTimeout(searchTimer);
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length < 1) { hideDropdown(n); return; }
    searchTimer = setTimeout(function() {
        fetch('/api/items/search?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dd = document.getElementById('itemDrop_' + n);
                dd.innerHTML = '';
                data.forEach(function(item) {
                    var a = document.createElement('a');
                    a.className = 'dropdown-item small';
                    a.href = '#';
                    a.textContent = item.item_code + ' ' + item.item_name;
                    a.onclick = function(e) {
                        e.preventDefault();
                        selectItem(n, item);
                    };
                    dd.appendChild(a);
                });
                if (data.length > 0) dd.classList.add('show');
                else dd.classList.remove('show');
            });
    }, 200);
}

function selectItem(n, item) {
    document.getElementById('itemId_' + n).value = item.id;
    document.getElementById('itemSearch_' + n).value = item.item_code + ' ' + item.item_name;
    document.querySelector('[name=price_' + n + ']').value = item.unit_price;
    hideDropdown(n);
    calcLine(n);
}

function showDropdown(n) {
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length >= 1) searchItem(n);
}

function hideDropdown(n) {
    document.getElementById('itemDrop_' + n).classList.remove('show');
}

document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (el && el.dataset.action === 'addLine') { addLine(); return; }
    if (el && el.dataset.action === 'removeLine') { removeLine(parseInt(el.dataset.line)); return; }
    document.querySelectorAll('.dropdown-menu.show').forEach(function(dd) {
        if (!dd.parentElement.contains(e.target)) dd.classList.remove('show');
    });
});

document.addEventListener('change', function(e) {
    var el = e.target.closest('[data-action="calcLine"]');
    if (el) calcLine(parseInt(el.dataset.line));
});

document.getElementById('prForm').addEventListener('submit', function() {
    calcTotal();
});

{% if pr and pr.lines %}
{% for line in pr.lines %}
addLine({{ line.item_id or 'null' }}, '{{ line.item_code or "" }}', '{{ line.item_name }}', {{ line.quantity }}, {{ line.estimated_price }}, '{{ line.notes or "" }}');
{% endfor %}
{% else %}
addLine();
{% endif %}
</script>
{% endblock %}
