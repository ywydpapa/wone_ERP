{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="prForm" action="/purchase-requisitions/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="pr_id" value="{{ pr.id if pr else 0 }}">
                <input type="hidden" name="line_nums" id="lineNums" value="">

                <div class="form-grid cols-2">
                    <label for="prReqDate" class="req">요청일</label>
                    <div class="fg-field"><input type="date" name="request_date" id="prReqDate" class="form-control" value="{{ pr.request_date if pr else today }}" required></div>
                    <label for="prNeedDate">필요일</label>
                    <div class="fg-field"><input type="date" name="need_date" id="prNeedDate" class="form-control" value="{{ pr.need_date if pr else '' }}"></div>
                    <label for="prDept">부서</label>
                    <div class="fg-field">
                        <select name="dept" id="prDept" class="form-select">
                            <option value="">선택 안함</option>
                            {% for dn in depts|default([]) %}
                            <option value="{{ dn }}" {{ 'selected' if pr and pr.dept == dn else '' }}>{{ dn }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="prNotes">비고</label>
                    <div class="fg-field fg-wide"><textarea name="notes" id="prNotes" class="form-control" rows="2">{{ pr.notes if pr else '' }}</textarea></div>
                </div>

                <datalist id="deptList">
                    {% for dn in depts|default([]) %}<option value="{{ dn }}">{% endfor %}
                </datalist>

                <h6 class="sec-title">요청 품목</h6>
                <div class="table-responsive mb-3">
                    <table class="grid-table" id="lineTable">
                        <thead>
                            <tr>
                                <th class="no">No</th>
                                <th>품목</th>
                                <th class="w-qty">수량</th>
                                <th class="w-amt">예상단가</th>
                                <th class="w-amt">예상금액</th>
                                <th class="w-mid">계정</th>
                                <th class="w-mid">부서</th>
                                <th class="w-mid col-opt">프로젝트</th>
                                <th class="col-opt">비고</th>
                                <th class="row-act"></th>
                            </tr>
                        </thead>
                        <tbody id="lineBody">
                        </tbody>
                        <tfoot>
                            <tr class="total">
                                <td colspan="4" class="text-center">합계</td>
                                <td class="num" id="totalAmount">0</td>
                                <td colspan="5" class="col-opt"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="grid-foot">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-action="addLine"><i class="fas fa-plus me-1"></i>품목 추가</button>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/purchase-requisitions" class="btn btn-outline-secondary">취소</a>
                    <span class="ab-msg" role="alert"></span>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var lineSeq = 0;
var costAccts = {{ cost_accts|default([])|tojson }};

function acctOptions(selected) {
    var html = '<option value="">선택</option>';
    costAccts.forEach(function(a) {
        html += '<option value="' + a.code + '"' + (a.code === selected ? ' selected' : '') + '>' + a.code + ' ' + a.name + '</option>';
    });
    return html;
}

function addLine(itemId, itemCode, itemName, qty, price, notes, acctCode, dept, projectCode) {
    lineSeq++;
    var n = lineSeq;
    var displayQty = qty || 1;
    var displayPrice = price || 0;
    var lineAmt = displayQty * displayPrice;
    var defaultDept = dept || document.getElementById('prDept').value;

    var tr = document.createElement('tr');
    tr.id = 'line_' + n;
    tr.innerHTML =
        '<td class="no">' + n + '</td>' +
        '<td class="inp position-relative">' +
            '<input type="hidden" name="item_id_' + n + '" id="itemId_' + n + '" value="' + (itemId || '') + '">' +
            '<input type="text" class="form-control" name="item_name_' + n + '" id="itemSearch_' + n + '" placeholder="품목 검색 또는 직접 입력" value="' + (itemName || '') + '" autocomplete="off" onfocus="showDropdown(' + n + ')" oninput="searchItem(' + n + ')">' +
            '<div class="dropdown-menu w-100 dropdown-scroll" id="itemDrop_' + n + '"></div>' +
        '</td>' +
        '<td class="inp"><input type="text" name="qty_' + n + '" class="form-control amt qty" inputmode="numeric" value="' + amt.fmt(displayQty) + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="inp"><input type="text" name="price_' + n + '" class="form-control amt price" inputmode="numeric" value="' + amt.fmt(displayPrice) + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="num" id="amt_' + n + '">' + amt.fmt(lineAmt) + '</td>' +
        '<td class="inp"><select name="account_code_' + n + '" id="acct_' + n + '" class="form-select">' + acctOptions(acctCode || '') + '</select></td>' +
        '<td class="inp"><input type="text" name="dept_' + n + '" class="form-control" value="' + (defaultDept || '') + '" list="deptList"></td>' +
        '<td class="inp col-opt"><input type="text" name="project_code_' + n + '" class="form-control" value="' + (projectCode || '') + '"></td>' +
        '<td class="inp col-opt"><input type="text" name="notes_' + n + '" class="form-control" value="' + (notes || '') + '"></td>' +
        '<td class="row-act"><button type="button" class="btn btn-sm" data-action="removeLine" data-line="' + n + '" tabindex="-1" title="삭제"><i class="fas fa-times"></i></button></td>';
    document.getElementById('lineBody').appendChild(tr);
    calcTotal();
}

function removeLine(n) {
    var el = document.getElementById('line_' + n);
    if (el) el.remove();
    calcTotal();
}

function calcLine(n) {
    var qty = amt.val(document.querySelector('[name=qty_' + n + ']'));
    var price = amt.val(document.querySelector('[name=price_' + n + ']'));
    document.getElementById('amt_' + n).textContent = amt.fmt(qty * price);
    calcTotal();
}

function calcTotal() {
    var total = 0;
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var amtEl = tr.querySelector('[id^=amt_]');
        if (amtEl) total += parseInt(amtEl.textContent.replace(/,/g, '')) || 0;
    });
    document.getElementById('totalAmount').textContent = amt.fmt(total);

    var nums = [];
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        nums.push(tr.id.replace('line_', ''));
    });
    document.getElementById('lineNums').value = nums.join(',');
}

var searchTimer;
function searchItem(n) {
    clearTimeout(searchTimer);
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length < 1) { hideDropdown(n); return; }
    searchTimer = setTimeout(function() {
        fetch('/api/items/search?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dd = document.getElementById('itemDrop_' + n);
                dd.innerHTML = '';
                data.forEach(function(item) {
                    var a = document.createElement('a');
                    a.className = 'dropdown-item small';
                    a.href = '#';
                    a.textContent = item.item_code + ' ' + item.item_name;
                    a.onclick = function(e) {
                        e.preventDefault();
                        selectItem(n, item);
                    };
                    dd.appendChild(a);
                });
                if (data.length > 0) dd.classList.add('show');
                else dd.classList.remove('show');
            });
    }, 200);
}

function selectItem(n, item) {
    document.getElementById('itemId_' + n).value = item.id;
    document.getElementById('itemSearch_' + n).value = item.item_code + ' ' + item.item_name;
    amt.set(document.querySelector('[name=price_' + n + ']'), item.unit_price);
    document.getElementById('acct_' + n).value = item.is_stock ? '' : item.account_code;
    hideDropdown(n);
    calcLine(n);
}

function showDropdown(n) {
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length >= 1) searchItem(n);
}

function hideDropdown(n) {
    document.getElementById('itemDrop_' + n).classList.remove('show');
}

document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (el && el.dataset.action === 'addLine') { addLine(); return; }
    if (el && el.dataset.action === 'removeLine') { removeLine(parseInt(el.dataset.line)); return; }
    document.querySelectorAll('.dropdown-menu.show').forEach(function(dd) {
        if (!dd.parentElement.contains(e.target)) dd.classList.remove('show');
    });
});

document.addEventListener('change', function(e) {
    var el = e.target.closest('[data-action="calcLine"]');
    if (el) calcLine(parseInt(el.dataset.line));
});

var prForm = document.getElementById('prForm');
prForm.addEventListener('submit', function() {
    calcTotal();
});
formKit.ajaxSubmit(prForm, { dirty: formKit.trackDirty(prForm) });

{% if pr and pr.lines %}
{% for line in pr.lines %}
addLine({{ line.item_id or 'null' }}, '{{ line.item_code or "" }}', '{{ line.item_name }}', {{ line.quantity }}, {{ line.estimated_price }}, '{{ line.notes or "" }}', {{ line.account_code|tojson }}, {{ line.dept|tojson }}, {{ line.project_code|tojson }});
{% endfor %}
{% elif item %}
addLine({{ item.id }}, {{ item.item_code|tojson }}, {{ item.item_name|tojson }}, {{ qty or 1 }}, {{ item.unit_price or 0 }}, '', {{ (item.account_code if not item.is_stock else '')|tojson }});
{% else %}
addLine();
{% endif %}
</script>
{% endblock %}
