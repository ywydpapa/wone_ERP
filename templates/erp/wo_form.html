{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="woForm" action="/work-orders/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="wo_id" value="{{ wo.id if wo else 0 }}">

                <div class="form-grid cols-2">
                    <label for="bomSelect" class="req">자재명세(BOM)</label>
                    <div class="fg-field fg-wide">
                        <select name="bom_id" id="bomSelect" class="form-select" required>
                            <option value="">선택</option>
                            {% for b in boms %}
                            <option value="{{ b.id }}" data-product="{{ b.item_name }}" {{ 'selected' if wo and wo.bom_id == b.id else '' }}>[{{ b.item_code }}] {{ b.item_name }} (v{{ b.bom_version }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="plannedQty" class="req">계획수량</label>
                    <div class="fg-field"><input type="text" name="planned_qty" id="plannedQty" class="form-control amt" inputmode="numeric" value="{{ wo.planned_qty if wo else 1 }}" required></div>
                    <label for="plannedStart">시작예정일</label>
                    <div class="fg-field"><input type="date" name="planned_start" id="plannedStart" class="form-control" value="{{ wo.start_date if wo else '' }}"></div>
                    <label for="plannedEnd">종료예정일</label>
                    <div class="fg-field"><input type="date" name="planned_end" id="plannedEnd" class="form-control" value="{{ wo.end_date if wo else '' }}"></div>
                    <label for="workerSelect">작업자</label>
                    <div class="fg-field">
                        <select name="worker_id" id="workerSelect" class="form-select">
                            <option value="">선택</option>
                            {% for w in workers %}
                            <option value="{{ w.id }}" {{ 'selected' if wo and wo.worker_id == w.id else '' }}>{{ w.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="woNotes">비고</label>
                    <div class="fg-field fg-wide"><textarea name="notes" id="woNotes" class="form-control" rows="2">{{ wo.notes if wo else '' }}</textarea></div>
                </div>

                <div id="bomPreview" class="mb-3 d-none">
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th>품목코드</th>
                                <th>자재명</th>
                                <th class="w-mid">단위</th>
                                <th class="w-qty">단위소요량</th>
                            </tr>
                        </thead>
                        <tbody id="bomLines"></tbody>
                    </table>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/work-orders" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('bomSelect').addEventListener('change', function() {
    var bomId = this.value;
    var preview = document.getElementById('bomPreview');
    var tbody = document.getElementById('bomLines');

    if (!bomId) {
        preview.classList.add('d-none');
        return;
    }

    fetch('/api/bom/' + bomId + '/lines')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            tbody.innerHTML = '';
            data.forEach(function(l) {
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td>' + l.item_code + '</td>' +
                    '<td>' + l.item_name + '</td>' +
                    '<td>' + l.unit + '</td>' +
                    '<td class="num">' + l.quantity + '</td>';
                tbody.appendChild(tr);
            });
            if (data.length > 0) preview.classList.remove('d-none');
            else preview.classList.add('d-none');
        });
});

{% if wo and wo.bom_id %}
document.getElementById('bomSelect').dispatchEvent(new Event('change'));
{% endif %}

var woForm = document.getElementById('woForm');
var woFormDirty = formKit.trackDirty(woForm);
woForm.addEventListener('submit', function() { woFormDirty.clear(); });

// Enter 암묵적 제출 차단
woForm.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
    e.preventDefault();
});
</script>
{% endblock %}
