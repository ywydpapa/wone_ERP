{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form action="/partners/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="partner_id" value="{{ partner.id if partner else 0 }}">

                <div class="form-grid cols-2">
                    <label for="pCode">거래처코드</label>
                    <div class="fg-field"><input type="text" name="code" id="pCode" class="form-control" value="{{ partner.code if partner else '' }}" placeholder="빈칸 시 자동 부여"></div>
                    <label for="pName" class="req">거래처명</label>
                    <div class="fg-field"><input type="text" name="name" id="pName" class="form-control" value="{{ partner.name if partner else '' }}" required></div>

                    <label for="pType">거래처유형</label>
                    <div class="fg-field">
                        <select name="partner_type" id="pType" class="form-select">
                            {% for k, v in partner_types.items() %}
                            <option value="{{ k }}" {{ 'selected' if partner and partner.partner_type == k else '' }}>{{ v }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="pBizNo">사업자번호</label>
                    <div class="fg-field"><input type="text" name="biz_no" id="pBizNo" class="form-control" value="{{ partner.biz_no if partner else '' }}" placeholder="000-00-00000"></div>

                    <label for="pRepr">대표자</label>
                    <div class="fg-field"><input type="text" name="representative" id="pRepr" class="form-control" value="{{ partner.representative if partner else '' }}"></div>
                    <label for="pTaxType">과세유형</label>
                    <div class="fg-field">
                        <select name="tax_type" id="pTaxType" class="form-select">
                            {% for t in ('과세', '영세', '면세') %}
                            <option value="{{ t }}" {{ 'selected' if partner and partner.tax_type == t else '' }}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <label for="pBizType">업태</label>
                    <div class="fg-field"><input type="text" name="biz_type" id="pBizType" class="form-control" value="{{ partner.biz_type if partner else '' }}"></div>
                    <label for="pBizItem">종목</label>
                    <div class="fg-field"><input type="text" name="biz_item" id="pBizItem" class="form-control" value="{{ partner.biz_item if partner else '' }}"></div>

                    <label for="pAddr">주소</label>
                    <div class="fg-field fg-wide"><input type="text" name="address" id="pAddr" class="form-control" value="{{ partner.address if partner else '' }}"></div>

                    <label for="pPhone">전화</label>
                    <div class="fg-field"><input type="text" name="phone" id="pPhone" class="form-control" value="{{ partner.phone if partner else '' }}"></div>
                    <label for="pFax">팩스</label>
                    <div class="fg-field"><input type="text" name="fax" id="pFax" class="form-control" value="{{ partner.fax if partner else '' }}"></div>

                    <label for="pEmail">이메일</label>
                    <div class="fg-field"><input type="email" name="email" id="pEmail" class="form-control" value="{{ partner.email if partner else '' }}"></div>
                    <label for="pContactName">담당자명</label>
                    <div class="fg-field"><input type="text" name="contact_name" id="pContactName" class="form-control" value="{{ partner.contact_name if partner else '' }}"></div>

                    <label for="pContactPhone">담당자연락처</label>
                    <div class="fg-field"><input type="text" name="contact_phone" id="pContactPhone" class="form-control" value="{{ partner.contact_phone if partner else '' }}"></div>
                    <label for="pContactEmail">담당자이메일</label>
                    <div class="fg-field"><input type="email" name="contact_email" id="pContactEmail" class="form-control" value="{{ partner.contact_email if partner else '' }}"></div>

                    <label for="pNotes">비고</label>
                    <div class="fg-field fg-wide"><textarea name="notes" id="pNotes" class="form-control" rows="2">{{ partner.notes if partner else '' }}</textarea></div>

                    <label for="pActive">사용여부</label>
                    <div class="fg-field">
                        <select name="is_active" id="pActive" class="form-select">
                            <option value="1" {{ 'selected' if not partner or partner.is_active else '' }}>사용</option>
                            <option value="0" {{ 'selected' if partner and not partner.is_active else '' }}>사용중지</option>
                        </select>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/partners" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
