{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form action="/warehouses/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="wh_id" value="{{ warehouse.id if warehouse else 0 }}">

                <div class="form-grid cols-2">
                    <label for="whCode" class="req">창고코드</label>
                    <div class="fg-field"><input type="text" name="code" id="whCode" class="form-control" value="{{ warehouse.code if warehouse else '' }}" required></div>
                    <label for="whName" class="req">창고명</label>
                    <div class="fg-field"><input type="text" name="name" id="whName" class="form-control" value="{{ warehouse.name if warehouse else '' }}" required></div>

                    <label for="whLoc">위치</label>
                    <div class="fg-field fg-wide"><input type="text" name="location" id="whLoc" class="form-control" value="{{ warehouse.location if warehouse else '' }}"></div>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/warehouses" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
