{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form action="/items/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="item_id" value="{{ item.id if item else 0 }}">

                <div class="form-grid cols-2">
                    <label for="itemCode" class="req">품목코드</label>
                    <div class="fg-field"><input type="text" name="item_code" id="itemCode" class="form-control" value="{{ item.item_code if item else '' }}" required></div>
                    <label for="itemName" class="req">품목명</label>
                    <div class="fg-field"><input type="text" name="item_name" id="itemName" class="form-control" value="{{ item.item_name if item else '' }}" required></div>

                    <label for="itemType">구분</label>
                    <div class="fg-field">
                        <select name="item_type" id="itemType" class="form-select">
                            {% for key, label in item_types.items() %}
                            <option value="{{ key }}" {{ 'selected' if item and item.item_type == key else '' }}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="itemUnit">단위</label>
                    <div class="fg-field"><input type="text" name="unit" id="itemUnit" class="form-control" value="{{ item.unit if item else 'EA' }}"></div>

                    <label for="itemPrice">단가</label>
                    <div class="fg-field"><input type="text" name="unit_price" id="itemPrice" class="form-control amt" inputmode="numeric" value="{{ item.unit_price if item else 0 }}"></div>
                    <label for="itemSafety">안전재고</label>
                    <div class="fg-field"><input type="text" name="safety_stock" id="itemSafety" class="form-control amt" inputmode="numeric" value="{{ item.safety_stock if item else 0 }}"></div>

                    <label for="itemCategory">분류</label>
                    <div class="fg-field fg-wide"><input type="text" name="category" id="itemCategory" class="form-control" value="{{ item.category if item else '' }}"></div>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/items" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
