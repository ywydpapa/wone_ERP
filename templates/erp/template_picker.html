{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="content-card">
                    <p class="text-muted mb-4">사용할 양식을 선택하세요.</p>

                    <div class="row g-3 mb-4">
                        <div class="col-sm-6 col-md-4">
                            <a href="/draft_doc?template_id=0" class="card h-100 text-decoration-none">
                                <div class="card-body text-center py-4">
                                    <i class="fas fa-file-alt fa-2x mb-2 text-secondary"></i>
                                    <div class="fw-bold">일반 기안</div>
                                    <div class="text-muted small">양식 없이 자유 작성</div>
                                </div>
                            </a>
                        </div>
                        {% for tpl in templates_list %}
                        <div class="col-sm-6 col-md-4">
                            <a href="/draft_doc?template_id={{ tpl.id }}" class="card h-100 text-decoration-none">
                                <div class="card-body text-center py-4">
                                    <i class="fas fa-clipboard-list fa-2x mb-2 text-primary"></i>
                                    <div class="fw-bold">{{ tpl.name }}</div>
                                    <div class="text-muted small">{{ tpl.category }}</div>
                                </div>
                            </a>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="text-center">
                        <a href="/erp_groupware" class="btn btn-light">
                            <i class="fas fa-arrow-left me-1"></i>돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
