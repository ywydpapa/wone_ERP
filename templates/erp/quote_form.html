{% extends "base.html" %}
{% set pid = qt.partner_id if qt else pre_partner %}
{% block styles %}
<style>
.qt-item { width: 260px; }
.qt-unit { width: 70px; }
.qt-disc { width: 90px; }
</style>
{% endblock %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="qtForm" action="/quotations/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="qt_id" value="{{ qt.id if qt else 0 }}">
                {% if opp_id %}<input type="hidden" name="opp_id" value="{{ opp_id }}">{% endif %}
                <input type="hidden" name="line_nums" id="lineNums" value="">

                <div class="form-grid cols-2">
                    <label for="qtPartnerCode" class="req">고객사</label>
                    <div class="fg-field fg-wide">
                        <div class="lookup">
                            <input type="text" id="qtPartnerCode" class="form-control lk-code" data-lookup="partner" placeholder="코드 또는 상호" required>
                            <button type="button" class="lk-btn" title="거래처 검색 (F2)"><i class="fas fa-search"></i></button>
                            <input type="text" class="form-control lk-name" aria-label="고객사명" readonly tabindex="-1">
                            <input type="hidden" name="partner_id" class="lk-id" value="{{ pid or '' }}">
                        </div>
                        <div class="small mt-1" id="partnerWarn"></div>
                    </div>
                    <div class="fg-label">전잔/후잔</div>
                    <div class="fg-field fg-wide"><span id="balPrev" class="num">-</span> / <span id="balNext" class="num">-</span> <span class="text-muted small" id="balNote"></span></div>
                    <label for="quoteDate" class="req">견적일</label>
                    <div class="fg-field"><input type="date" name="quote_date" id="quoteDate" class="form-control" value="{{ qt.quote_date if qt else today }}" required></div>
                    <label for="validUntil">유효기한</label>
                    <div class="fg-field"><input type="date" name="valid_until" id="validUntil" class="form-control" value="{{ qt.valid_until if qt else '' }}"></div>
                    <label for="qtContact">담당자</label>
                    <div class="fg-field">
                        <select name="contact_id" id="qtContact" class="form-select">
                            <option value="">선택 안 함</option>
                        </select>
                    </div>
                    <label for="qtShipTo">배송지</label>
                    <div class="fg-field fg-wide">
                        <select id="qtAddr" class="form-select addr-select">
                            <option value="">선택 안 함</option>
                        </select>
                        <input type="text" name="ship_to" id="qtShipTo" class="form-control" value="{{ qt.ship_to if qt else '' }}" placeholder="배송지 직접 입력">
                    </div>
                    <label for="qtNotes">비고</label>
                    <div class="fg-field fg-wide"><textarea name="notes" id="qtNotes" class="form-control" rows="2">{{ qt.notes if qt else '' }}</textarea></div>
                </div>

                <div class="table-responsive mb-2">
                    <table class="grid-table" id="lineTable">
                        <thead>
                            <tr>
                                <th class="no">No</th>
                                <th class="qt-item">품목</th>
                                <th class="qt-unit">단위</th>
                                <th class="w-qty">수량</th>
                                <th class="w-amt">단가</th>
                                <th class="qt-disc">할인율(%)</th>
                                <th class="w-amt">금액</th>
                                <th class="row-act"></th>
                            </tr>
                        </thead>
                        <tbody id="lineBody">
                        </tbody>
                        <tfoot>
                            <tr class="total">
                                <td colspan="6" class="text-center">합계</td>
                                <td class="num" id="totalAmount">0</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="grid-foot">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-action="addLine"><i class="fas fa-plus me-1"></i>품목 추가</button>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/quotations" class="btn btn-outline-secondary">취소</a>
                    <span class="ab-msg" id="qtFormMsg" role="alert"></span>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var lineSeq = 0;

function addLine(itemId, itemCode, itemName, unit, qty, price, discount) {
    lineSeq++;
    var n = lineSeq;
    var displayCode = itemCode || '';
    var displayName = itemName || '';
    var displayUnit = unit || '';
    var displayQty = qty || 1;
    var displayPrice = price || 0;
    var displayDiscount = discount || 0;
    var total = Math.round(displayQty * displayPrice * (1 - displayDiscount / 100));

    var tr = document.createElement('tr');
    tr.id = 'line_' + n;
    tr.innerHTML =
        '<td class="no">' + n + '</td>' +
        '<td class="inp">' +
            '<input type="hidden" name="item_id_' + n + '" id="itemId_' + n + '" value="' + (itemId || '') + '">' +
            '<div class="input-group input-group-sm">' +
                '<input type="text" class="form-control" id="itemSearch_' + n + '" placeholder="품목 검색" value="' + (displayCode ? displayCode + ' ' + displayName : '') + '" autocomplete="off" onfocus="showDropdown(' + n + ')" oninput="searchItem(' + n + ')">' +
                '<div class="dropdown-menu w-100 dropdown-scroll" id="itemDrop_' + n + '"></div>' +
            '</div>' +
        '</td>' +
        '<td><span id="unitLabel_' + n + '">' + displayUnit + '</span></td>' +
        '<td class="inp"><input type="text" name="qty_' + n + '" class="form-control amt qty" inputmode="numeric" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="inp"><input type="text" name="price_' + n + '" class="form-control amt price" inputmode="numeric" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="inp"><input type="number" name="discount_' + n + '" class="form-control text-end" min="0" max="100" step="0.1" value="' + displayDiscount + '" data-action="calcLine" data-line="' + n + '"></td>' +
        '<td class="num" id="amt_' + n + '">' + total.toLocaleString() + '</td>' +
        '<td class="row-act"><button type="button" class="btn btn-sm" data-action="removeLine" data-line="' + n + '" title="삭제"><i class="fas fa-times"></i></button></td>';
    document.getElementById('lineBody').appendChild(tr);
    amt.set(tr.querySelector('[name=qty_' + n + ']'), displayQty);
    amt.set(tr.querySelector('[name=price_' + n + ']'), displayPrice);
    calcTotal();
}

function removeLine(n) {
    var el = document.getElementById('line_' + n);
    if (el) el.remove();
    calcTotal();
}

function calcLine(n) {
    var qty = amt.val(document.querySelector('[name=qty_' + n + ']'));
    var price = amt.val(document.querySelector('[name=price_' + n + ']'));
    var discount = parseFloat(document.querySelector('[name=discount_' + n + ']').value) || 0;
    var total = Math.round(qty * price * (1 - discount / 100));
    document.getElementById('amt_' + n).textContent = total.toLocaleString();
    calcTotal();
}

function calcTotal() {
    var total = 0;
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var amtEl = tr.querySelector('[id^=amt_]');
        if (amtEl) total += parseInt(amtEl.textContent.replace(/,/g, '')) || 0;
    });
    document.getElementById('totalAmount').textContent = total.toLocaleString();
    curTotal = total;
    showBalance();

    var nums = [];
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        var id = tr.id.replace('line_', '');
        nums.push(id);
    });
    document.getElementById('lineNums').value = nums.join(',');
}

var searchTimer;
function searchItem(n) {
    clearTimeout(searchTimer);
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length < 1) { hideDropdown(n); return; }
    searchTimer = setTimeout(function() {
        fetch('/api/items/search?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dd = document.getElementById('itemDrop_' + n);
                dd.innerHTML = '';
                data.forEach(function(item) {
                    var a = document.createElement('a');
                    a.className = 'dropdown-item small';
                    a.href = '#';
                    a.textContent = item.item_code + ' ' + item.item_name + ' (' + item.unit + ')';
                    a.onclick = function(e) {
                        e.preventDefault();
                        selectItem(n, item);
                    };
                    dd.appendChild(a);
                });
                if (data.length > 0) dd.classList.add('show');
                else dd.classList.remove('show');
            });
    }, 200);
}

function selectItem(n, item) {
    document.getElementById('itemId_' + n).value = item.id;
    document.getElementById('itemSearch_' + n).value = item.item_code + ' ' + item.item_name;
    document.getElementById('unitLabel_' + n).textContent = item.unit;
    document.getElementById('line_' + n).dataset.base = item.unit_price;
    hideDropdown(n);
    applyRate(n);
}

// 거래처별 단가 우선, 없으면 출고단가 그룹 조정률. 기본단가는 행에 보관해 거래처 변경 시 재계산
var rate = 0, prices = {}, bal = null, curTotal = 0;
function applyRate(n) {
    var tr = document.getElementById('line_' + n);
    if (tr.dataset.base === undefined) return;
    var fixed = prices[document.getElementById('itemId_' + n).value];
    amt.set(tr.querySelector('[name=price_' + n + ']'), fixed !== undefined ? fixed : Math.round(tr.dataset.base * (1 + rate / 100)));
    calcLine(n);
}

// 전잔은 승인 전표 기준 미수잔액, 후잔은 이번 견적 공급가액+부가세 반영
function showBalance() {
    var prev = document.getElementById('balPrev'), next = document.getElementById('balNext');
    if (!bal) { prev.textContent = next.textContent = '-'; document.getElementById('balNote').textContent = ''; return; }
    prev.textContent = amt.fmt(bal.balance);
    next.textContent = amt.fmt(bal.balance + curTotal + Math.floor(curTotal * 0.1));
    document.getElementById('balNote').textContent = bal.limit ? '(여신한도 ' + amt.fmt(bal.limit) + ')' : '';
}

function applyAll() {
    document.querySelectorAll('#lineBody tr').forEach(function(tr) { applyRate(tr.id.replace('line_', '')); });
}

var qtContact = formKit.contactPicker(document.getElementById('qtContact'), 'sales');
var qtAddr = formKit.addrPicker(document.getElementById('qtAddr'));
var keepContactId = {{ (qt.contact_id if qt and qt.contact_id else 0)|tojson }};

function fillShipTo(opt) {
    if (opt && opt.dataset.text) document.getElementById('qtShipTo').value = opt.dataset.text;
}
document.getElementById('qtAddr').addEventListener('change', function(e) { fillShipTo(e.target.selectedOptions[0]); });

function setPartner(row) {
    rate = row ? row.sale_rate : 0;
    prices = {};
    applyAll();
    if (row) fetch('/api/partners/' + row.id + '/prices?kind=sale').then(function(r) { return r.json(); }).then(function(d) {
        prices = d;
        applyAll();
    });
    bal = null;
    showBalance();
    if (row) fetch('/api/partners/' + row.id + '/credit').then(function(r) { return r.json(); }).then(function(d) {
        bal = d;
        showBalance();
    });
    formKit.partnerWarn(document.getElementById('partnerWarn'), row);
    qtContact.load(row ? row.id : 0, keepContactId);
    keepContactId = null;
    qtAddr.load(row ? row.id : 0).then(function() {
        if (!document.getElementById('qtShipTo').value) fillShipTo(document.getElementById('qtAddr').selectedOptions[0]);
    });
}

document.getElementById('qtPartnerCode').addEventListener('lookup', function(e) { setPartner(e.detail); });

function showDropdown(n) {
    var q = document.getElementById('itemSearch_' + n).value.trim();
    if (q.length >= 1) searchItem(n);
}

function hideDropdown(n) {
    document.getElementById('itemDrop_' + n).classList.remove('show');
}

document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (el && el.dataset.action === 'addLine') { addLine(); return; }
    if (el && el.dataset.action === 'removeLine') { removeLine(parseInt(el.dataset.line)); return; }
    document.querySelectorAll('.dropdown-menu.show').forEach(function(dd) {
        if (!dd.parentElement.contains(e.target)) dd.classList.remove('show');
    });
});

document.addEventListener('change', function(e) {
    var el = e.target.closest('[data-action="calcLine"]');
    if (el) calcLine(parseInt(el.dataset.line));
});

var qtForm = document.getElementById('qtForm');
qtForm.addEventListener('submit', function() {
    calcTotal();
});

// Enter 암묵적 제출 차단. 코드조회 칸은 별도 처리
qtForm.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || e.target.classList.contains('lk-code')) return;
    e.preventDefault();
});

var qtFormDirty = formKit.trackDirty(qtForm);
formKit.ajaxSubmit(qtForm, { dirty: qtFormDirty });

formKit.onMasterChange('partner', function() { lookup.reload('partner'); });

{% if qt and qt.lines %}
{% for line in qt.lines %}
addLine({{ line.item_id }}, '{{ line.item_code }}', '{{ line.item_name }}', '{{ line.unit }}', {{ line.quantity }}, {{ line.unit_price }}, {{ line.discount_rate }});
{% endfor %}
{% else %}
addLine();
{% endif %}

{% if pid %}
lookup.load('partner').then(function(rows) {
    var p = rows.find(function(r) { return r.id === {{ pid }}; });
    if (p) {
        document.getElementById('qtPartnerCode').value = p.code;
        document.querySelector('#qtForm .lk-name').value = p.name;
        setPartner(p);
    }
});
{% endif %}
</script>
{% endblock %}
