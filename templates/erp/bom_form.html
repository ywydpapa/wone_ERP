{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="bomForm" action="/bom/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="bom_id" value="{{ bom.id if bom else 0 }}">
                <input type="hidden" name="line_nums" id="lineNums" value="">

                <div class="form-grid cols-2">
                    <label for="productSelect" class="req">제품</label>
                    <div class="fg-field fg-wide">
                        <select name="product_id" id="productSelect" class="form-select" required>
                            <option value="">선택</option>
                            {% for p in products %}
                            <option value="{{ p.id }}" {{ 'selected' if bom and bom.product_id == p.id else '' }}>[{{ p.item_code }}] {{ p.item_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="bomVersion">버전</label>
                    <div class="fg-field"><input type="text" name="bom_version" id="bomVersion" class="form-control" value="{{ bom.bom_version if bom else '1.0' }}"></div>
                    <label for="effDate">적용일</label>
                    <div class="fg-field"><input type="date" name="effective_date" id="effDate" class="form-control" value="{{ bom.effective_date if bom and bom.effective_date else today }}"></div>
                </div>

                <div class="table-responsive mb-3">
                    <table class="grid-table" id="lineTable">
                        <thead>
                            <tr>
                                <th class="no">No</th>
                                <th>자재</th>
                                <th class="w-mid">단위</th>
                                <th class="w-qty">소요량</th>
                                <th class="w-mid">공정</th>
                                <th class="row-act"></th>
                            </tr>
                        </thead>
                        <tbody id="lineBody">
                        </tbody>
                    </table>
                </div>
                <div class="grid-foot">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-action="addLine"><i class="fas fa-plus me-1"></i>자재 추가</button>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-primary">저장</button>
                    <a href="/bom" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var lineSeq = 0;

function addLine(compId, compCode, compName, unit, qty, step) {
    lineSeq++;
    var n = lineSeq;
    var displayCode = compCode || '';
    var displayName = compName || '';
    var displayUnit = unit || 'EA';
    var displayQty = qty || 1;
    var displayStep = step || '';

    var tr = document.createElement('tr');
    tr.id = 'line_' + n;
    tr.innerHTML =
        '<td class="no">' + n + '</td>' +
        '<td class="inp">' +
            '<input type="hidden" name="component_id_' + n + '" id="compId_' + n + '" value="' + (compId || '') + '">' +
            '<div class="input-group input-group-sm">' +
                '<input type="text" class="form-control" id="compSearch_' + n + '" placeholder="자재 검색" value="' + (displayCode ? displayCode + ' ' + displayName : '') + '" autocomplete="off" onfocus="showDropdown(' + n + ')" oninput="searchItem(' + n + ')">' +
                '<div class="dropdown-menu w-100 dropdown-scroll" id="compDrop_' + n + '"></div>' +
            '</div>' +
        '</td>' +
        '<td class="inp"><input type="text" name="unit_' + n + '" class="form-control" value="' + displayUnit + '"></td>' +
        '<td class="inp"><input type="number" name="qty_' + n + '" class="form-control" min="0.01" step="0.01" value="' + displayQty + '"></td>' +
        '<td class="inp"><input type="text" name="step_' + n + '" class="form-control" placeholder="공정명" value="' + displayStep + '"></td>' +
        '<td class="row-act"><button type="button" class="btn btn-sm" data-action="removeLine" data-line="' + n + '"><i class="fas fa-times"></i></button></td>';
    document.getElementById('lineBody').appendChild(tr);
    updateLineNums();
}

function removeLine(n) {
    var el = document.getElementById('line_' + n);
    if (el) el.remove();
    updateLineNums();
}

function updateLineNums() {
    var nums = [];
    document.querySelectorAll('#lineBody tr').forEach(function(tr) {
        nums.push(tr.id.replace('line_', ''));
    });
    document.getElementById('lineNums').value = nums.join(',');
}

var searchTimer;
function searchItem(n) {
    clearTimeout(searchTimer);
    var q = document.getElementById('compSearch_' + n).value.trim();
    if (q.length < 1) { hideDropdown(n); return; }
    searchTimer = setTimeout(function() {
        fetch('/api/items/search?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dd = document.getElementById('compDrop_' + n);
                dd.innerHTML = '';
                data.forEach(function(item) {
                    var a = document.createElement('a');
                    a.className = 'dropdown-item small';
                    a.href = '#';
                    a.textContent = item.item_code + ' ' + item.item_name + ' (' + item.unit + ')';
                    a.onclick = function(e) {
                        e.preventDefault();
                        selectItem(n, item);
                    };
                    dd.appendChild(a);
                });
                if (data.length > 0) dd.classList.add('show');
                else dd.classList.remove('show');
            });
    }, 200);
}

function selectItem(n, item) {
    document.getElementById('compId_' + n).value = item.id;
    document.getElementById('compSearch_' + n).value = item.item_code + ' ' + item.item_name;
    document.querySelector('[name=unit_' + n + ']').value = item.unit;
    hideDropdown(n);
}

function showDropdown(n) {
    var q = document.getElementById('compSearch_' + n).value.trim();
    if (q.length >= 1) searchItem(n);
}

function hideDropdown(n) {
    document.getElementById('compDrop_' + n).classList.remove('show');
}

document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (el && el.dataset.action === 'addLine') { addLine(); return; }
    if (el && el.dataset.action === 'removeLine') { removeLine(parseInt(el.dataset.line)); return; }
    document.querySelectorAll('.dropdown-menu.show').forEach(function(dd) {
        if (!dd.parentElement.contains(e.target)) dd.classList.remove('show');
    });
});

var bomForm = document.getElementById('bomForm');
var bomFormDirty = formKit.trackDirty(bomForm);

bomForm.addEventListener('submit', function() {
    updateLineNums();
    bomFormDirty.clear();
});

// Enter 암묵적 제출 차단
bomForm.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
    e.preventDefault();
});

{% if bom and bom.lines %}
{% for line in bom.lines %}
addLine({{ line.component_id }}, '{{ line.item_code }}', '{{ line.item_name }}', '{{ line.unit }}', {{ line.quantity }}, '{{ line.process_step or "" }}');
{% endfor %}
{% else %}
addLine();
{% endif %}
</script>
{% endblock %}
