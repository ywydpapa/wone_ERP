{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            <form id="accrualForm" action="/accruals" method="POST">
{{ csrf_input }}
                <div class="form-grid cols-2">
                    <label for="accKind" class="req">구분</label>
                    <div class="fg-field">
                        <select name="kind" id="accKind" class="form-select" required>
                            {% for v, label in kind_opts %}
                            <option value="{{ v }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="accExpense" class="req">비용 계정</label>
                    <div class="fg-field">
                        <select name="expense_code" id="accExpense" class="form-select" required>
                            {% for a in cost_accts %}
                            <option value="{{ a.code }}">{{ a.code }} {{ a.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="accAmount" class="req">금액</label>
                    <div class="fg-field"><input type="number" name="amount" id="accAmount" class="form-control" min="1" required></div>
                    <label for="accPartner">거래처</label>
                    <div class="fg-field">
                        <select name="partner_id" id="accPartner" class="form-select">
                            <option value="">선택 안함</option>
                            {% for p in partners %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="accStart" class="req">배분 시작월</label>
                    <div class="fg-field"><input type="month" name="start_ym" id="accStart" class="form-control" required></div>
                    <label for="accEnd" class="req">배분 종료월</label>
                    <div class="fg-field"><input type="month" name="end_ym" id="accEnd" class="form-control" required></div>
                    <label for="accDept">부서</label>
                    <div class="fg-field">
                        <select name="dept" id="accDept" class="form-select">
                            <option value="">선택 안함</option>
                            {% for d in depts %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="accMemo">메모</label>
                    <div class="fg-field"><input type="text" name="memo" id="accMemo" class="form-control"></div>
                </div>

                <div class="action-bar">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a href="/accruals" class="btn btn-outline-secondary">취소</a>
                    <span class="ab-msg" id="accrualMsg" role="alert"></span>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var accrualForm = document.getElementById('accrualForm');
formKit.ajaxSubmit(accrualForm);
</script>
{% endblock %}
