{% extends "base.html" %}
{% block content %}
<div class="list-section">
    <div class="container">
        <div class="content-card">
            {% if wo %}
            <div class="alert alert-light border small mb-3">
                <strong>작업지시:</strong> {{ wo.wo_number }}
                &nbsp;&nbsp;|&nbsp;&nbsp;
                <strong>제품:</strong> {{ wo.item_name }}
                &nbsp;&nbsp;|&nbsp;&nbsp;
                <strong>잔여수량:</strong> {{ "{:,}".format(wo.remaining_qty) }}
            </div>
            {% endif %}

            <form id="prodResultForm" action="/production-results/save" method="POST">
{{ csrf_input }}
                <input type="hidden" name="wo_id" value="{{ wo.id if wo else 0 }}">

                <div class="form-grid cols-2">
                    <label for="goodQty" class="req">양품수량</label>
                    <div class="fg-field"><input type="text" name="good_qty" id="goodQty" class="form-control amt" inputmode="numeric" required></div>
                    <label for="defectQty">불량수량</label>
                    <div class="fg-field"><input type="text" name="defect_qty" id="defectQty" class="form-control amt" inputmode="numeric" value="0"></div>
                    <label for="resultDate" class="req">보고일</label>
                    <div class="fg-field"><input type="date" name="result_date" id="resultDate" class="form-control" value="{{ today }}" required></div>
                    <label for="whSelect" class="req">입고 창고</label>
                    <div class="fg-field">
                        <select name="warehouse_id" id="whSelect" class="form-select" required>
                            <option value="">선택</option>
                            {% for w in warehouses %}
                            <option value="{{ w.id }}">[{{ w.code }}] {{ w.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="workerSelect">작업자</label>
                    <div class="fg-field">
                        <select name="worker_id" id="workerSelect" class="form-select">
                            <option value="">선택</option>
                            {% for w in workers %}
                            <option value="{{ w.id }}">{{ w.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label for="prNotes">비고</label>
                    <div class="fg-field"><input type="text" name="notes" id="prNotes" class="form-control"></div>
                </div>

                <div class="action-bar">
                    <button type="submit" data-key="F8" aria-keyshortcuts="F8" title="F8" class="btn btn-success">실적 등록</button>
                    <a href="/work-orders/{{ wo.id if wo else '' }}" class="btn btn-outline-secondary">취소</a>
                    <span class="ab-msg" role="alert"></span>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var prodResultForm = document.getElementById('prodResultForm');
formKit.ajaxSubmit(prodResultForm, { dirty: formKit.trackDirty(prodResultForm) });
</script>
{% endblock %}
