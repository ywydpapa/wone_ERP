{% extends "base.html" %}
{% block content %}
<div class="page-toolbar d-flex justify-content-between align-items-center mb-3">
    <form method="get" class="d-flex gap-2 align-items-center">
        <select name="year" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
            {% for y in range(year-2, year+3) %}
            <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}년</option>
            {% endfor %}
        </select>
    </form>
    <a href="/budget/vs-actual?year={{ year }}" class="btn btn-outline-primary btn-sm">
        <i class="fas fa-chart-line me-1"></i>실적 비교
    </a>
</div>

<form method="post" action="/budget/save">
    <input type="hidden" name="year" value="{{ year }}">
    <div class="content-card">
        <div class="table-responsive">
            <table class="table table-sm small mb-0">
                <thead>
                    <tr>
                        <th>계정</th>
                        {% for m in range(1, 13) %}
                        <th class="text-center" style="width:70px">{{ m }}월</th>
                        {% endfor %}
                        <th class="text-end">합계</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in grid %}
                    <tr>
                        <td class="text-nowrap">[{{ row.code }}] {{ row.name }}</td>
                        {% for m in range(12) %}
                        <td>
                            <input type="number" name="b_{{ row.code }}_{{ m+1 }}"
                                   value="{{ row.months[m] or '' }}"
                                   class="form-control form-control-sm text-end p-1"
                                   style="width:70px" min="0" step="10000">
                        </td>
                        {% endfor %}
                        <td class="text-end fw-600">{{ "{:,}".format(row.total) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i>저장
        </button>
    </div>
</form>
{% endblock %}
