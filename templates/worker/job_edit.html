{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="content-card">

            <form id="jobEditForm" action="/api/jobs/{{ job.id }}" method="POST">
{{ csrf_input }}

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="workDate" class="form-label fw-bold">작성 일자 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="workDate" name="workDate"
                               value="{{ job.work_date }}" required>
                    </div>
                    <div class="col-md-4 mt-3 mt-md-0">
                        <label for="startTime" class="form-label fw-bold">시작 시간</label>
                        <input type="time" class="form-control" id="startTime" name="startTime"
                               value="{{ job.start_time or '' }}">
                    </div>
                    <div class="col-md-4 mt-3 mt-md-0">
                        <label for="endTime" class="form-label fw-bold">종료 시간</label>
                        <input type="time" class="form-control" id="endTime" name="endTime"
                               value="{{ job.end_time or '' }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="workCategory" class="form-label fw-bold">업무 분류 <span class="text-danger">*</span></label>
                        <select class="form-select" id="workCategory" name="workCategory" required>
                            <option value="" disabled>분류를 선택하세요</option>
                            {% for val, lbl in categories %}
                            <option value="{{ val }}" {% if job.category == val %}selected{% endif %}>{{ lbl }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mt-3 mt-md-0">
                        <label for="workVolume" class="form-label fw-bold">처리량</label>
                        <input type="number" class="form-control" id="workVolume" name="workVolume"
                               min="0" value="{{ job.volume or 0 }}">
                    </div>
                    <div class="col-md-3 mt-3 mt-md-0">
                        <label for="volumeUnit" class="form-label fw-bold">단위</label>
                        <select class="form-select" id="volumeUnit" name="volumeUnit">
                            <option value="">선택</option>
                            {% for u in ['건','페이지','개','시간','장'] %}
                            <option value="{{ u }}" {% if job.volume_unit == u %}selected{% endif %}>{{ u }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                {% if my_tasks %}
                <div class="mb-3">
                    <label for="taskId" class="form-label fw-bold">연결 업무 (선택)</label>
                    <select class="form-select" id="taskId" name="taskId">
                        <option value="0">없음</option>
                        {% for t in my_tasks %}
                        <option value="{{ t.id }}" {% if job.task_id == t.id %}selected{% endif %}>{{ t.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="workTitle" class="form-label fw-bold">주요 업무 제목 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="workTitle" name="workTitle"
                           value="{{ job.title }}" required>
                </div>

                <div class="mb-3">
                    <label for="workDetails" class="form-label fw-bold">상세 업무 내용 <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="workDetails" name="workDetails" rows="5" required>{{ job.details or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="workIssues" class="form-label fw-bold">특이사항 및 이슈 (선택)</label>
                    <textarea class="form-control" id="workIssues" name="workIssues" rows="3">{{ job.issues or '' }}</textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="workDept" class="form-label fw-bold">부서</label>
                        <input type="text" class="form-control" id="workDept" name="workDept"
                               value="{{ job.dept or '' }}">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="workDue" class="form-label fw-bold">마감/완료</label>
                        <input type="text" class="form-control" id="workDue" name="workDue"
                               value="{{ job.due_label or '' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold d-block">현재 진행 상태 <span class="text-danger">*</span></label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="progressStatus" id="statusDone" value="done"
                               {% if job.status == 'done' %}checked{% endif %}>
                        <label class="form-check-label" for="statusDone">
                            <span class="badge bg-light text-dark border">완료</span>
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="progressStatus" id="statusProgress" value="progress"
                               {% if job.status in ['progress', 'in_progress'] %}checked{% endif %}>
                        <label class="form-check-label" for="statusProgress">
                            <span class="badge bg-light text-dark border">진행중</span>
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="progressStatus" id="statusDelay" value="delay"
                               {% if job.status == 'delay' %}checked{% endif %}>
                        <label class="form-check-label" for="statusDelay">
                            <span class="badge bg-light text-dark border">지연/보류</span>
                        </label>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <a href="/job/{{ job.id }}" class="btn btn-light px-4">취소</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save me-2"></i>저장하기
                    </button>
                </div>
                <span class="ab-msg" role="alert"></span>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var jobEditForm = document.getElementById('jobEditForm');
var jobEditDirty = formKit.trackDirty(jobEditForm);
formKit.ajaxSubmit(jobEditForm, { dirty: jobEditDirty });
</script>
{% endblock %}
