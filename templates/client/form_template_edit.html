{% extends "base.html" %}
{% block content %}
    <div class="content-card mt-3">
        <div class="card-title">
            {{ '서식 수정' if tpl else '새 서식 등록' }}
        </div>

        <form method="post" action="{{ '/client/form-templates/' ~ tpl.id if tpl else '/client/form-templates' }}" id="tplForm">
{{ csrf_input }}
            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">서식명 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control form-control-sm"
                           value="{{ tpl.name if tpl else '' }}" required>
                </div>
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">분류</label>
                    <input type="text" name="category" class="form-control form-control-sm"
                           value="{{ tpl.category if tpl else '일반' }}" list="cat-list">
                    <datalist id="cat-list">
                        <option value="일반">
                        <option value="인사">
                        <option value="총무">
                        <option value="경리">
                    </datalist>
                </div>
            </div>

            <input type="hidden" name="fields_json" id="fieldsJson">

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-semibold small">양식 항목</span>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="addFieldBtn">
                        <i class="fas fa-plus me-1"></i>항목 추가
                    </button>
                </div>
                <div id="fieldList"></div>
            </div>

            <div class="mb-4">
                <span class="fw-semibold small d-block mb-2">미리보기</span>
                <div class="border rounded p-3 bg-light" id="preview"></div>
            </div>

            <div class="d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-primary btn-sm">저장</button>
                <a href="/client/form-templates" class="btn btn-outline-secondary btn-sm">취소</a>
                <span class="ab-msg" role="alert"></span>
            </div>
        </form>

        {% if tpl %}
        <form method="post" action="/client/form-templates/{{ tpl.id }}/delete"
              id="deleteForm" class="mt-3 text-end">
{{ csrf_input }}
            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
        </form>
        {% endif %}
    </div>
{% endblock %}

{% block scripts %}
<script>
var fields = {{ tpl.fields | tojson if tpl else '[]' }};
var FIELD_TYPES = {text: '텍스트', textarea: '장문', number: '숫자', date: '날짜', select: '선택', checkbox: '체크박스'};

function renderFields() {
    var list = document.getElementById('fieldList');
    list.innerHTML = '';
    fields.forEach(function(f, i) {
        var row = document.createElement('div');
        row.className = 'border rounded p-2 mb-2 bg-white';
        var html = '<div class="row g-2 align-items-center">';
        html += '<div class="col-sm-3"><input class="form-control form-control-sm" value="' + esc(f.label) + '" placeholder="항목명" data-i="' + i + '" data-k="label"></div>';
        html += '<div class="col-sm-2"><select class="form-select form-select-sm" data-i="' + i + '" data-k="type">';
        for (var k in FIELD_TYPES) {
            html += '<option value="' + k + '"' + (f.type === k ? ' selected' : '') + '>' + FIELD_TYPES[k] + '</option>';
        }
        html += '</select></div>';
        html += '<div class="col-sm-2"><select class="form-select form-select-sm" data-i="' + i + '" data-k="required">';
        html += '<option value="false"' + (!f.required ? ' selected' : '') + '>선택</option>';
        html += '<option value="true"' + (f.required ? ' selected' : '') + '>필수</option>';
        html += '</select></div>';
        if (f.type === 'select') {
            html += '<div class="col-sm-3"><input class="form-control form-control-sm" value="' + esc((f.options || []).join(',')) + '" placeholder="옵션(콤마 구분)" data-i="' + i + '" data-k="options"></div>';
        } else {
            html += '<div class="col-sm-3"></div>';
        }
        html += '<div class="col-sm-2 text-end">';
        if (i > 0) html += '<button type="button" class="btn btn-sm btn-link p-0 me-2" data-field-action="up" data-i="' + i + '"><i class="fas fa-arrow-up"></i></button>';
        if (i < fields.length - 1) html += '<button type="button" class="btn btn-sm btn-link p-0 me-2" data-field-action="down" data-i="' + i + '"><i class="fas fa-arrow-down"></i></button>';
        html += '<button type="button" class="btn btn-sm btn-link text-danger p-0" data-field-action="remove" data-i="' + i + '"><i class="fas fa-times"></i></button>';
        html += '</div></div>';
        row.innerHTML = html;
        list.appendChild(row);
    });

    list.querySelectorAll('[data-k]').forEach(function(el) {
        el.addEventListener('change', function() { updateField(this); });
        el.addEventListener('input', function() { updateField(this); });
    });

    renderPreview();
}

function updateField(el) {
    var i = parseInt(el.dataset.i);
    var k = el.dataset.k;
    if (k === 'required') {
        fields[i][k] = el.value === 'true';
    } else if (k === 'options') {
        fields[i][k] = el.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    } else {
        fields[i][k] = el.value;
    }
    if (k === 'type') renderFields();
    else renderPreview();
}

function addField() {
    fields.push({label: '', name: 'field_' + Date.now(), type: 'text', required: false});
    renderFields();
}

function removeField(i) {
    fields.splice(i, 1);
    renderFields();
}

function moveField(i, dir) {
    var j = i + dir;
    var tmp = fields[i];
    fields[i] = fields[j];
    fields[j] = tmp;
    renderFields();
}

function renderPreview() {
    var box = document.getElementById('preview');
    if (!fields.length) { box.innerHTML = '<span class="text-muted small">항목을 추가하면 미리보기가 표시됩니다.</span>'; return; }
    var html = '<div class="row g-3">';
    fields.forEach(function(f) {
        html += '<div class="col-sm-12"><label class="form-label fw-semibold small">' + esc(f.label || '(미입력)');
        if (f.required) html += ' <span class="text-danger">*</span>';
        html += '</label>';
        if (f.type === 'textarea') html += '<textarea class="form-control form-control-sm" rows="3" disabled></textarea>';
        else if (f.type === 'select') {
            html += '<select class="form-select form-select-sm" disabled><option>선택하세요</option>';
            (f.options || []).forEach(function(o) { html += '<option>' + esc(o) + '</option>'; });
            html += '</select>';
        } else if (f.type === 'checkbox') {
            html += '<div class="form-check"><input class="form-check-input" type="checkbox" disabled><label class="form-check-label small">' + esc(f.label) + '</label></div>';
        } else {
            html += '<input type="' + (f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text') + '" class="form-control form-control-sm" disabled>';
        }
        html += '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.getElementById('addFieldBtn').addEventListener('click', addField);

document.getElementById('fieldList').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-field-action]');
    if (!btn) return;
    var i = parseInt(btn.dataset.i, 10);
    var action = btn.dataset.fieldAction;
    if (action === 'remove') removeField(i);
    else if (action === 'up') moveField(i, -1);
    else if (action === 'down') moveField(i, 1);
});

var tplForm = document.getElementById('tplForm');
tplForm.addEventListener('submit', function() {
    fields.forEach(function(f, i) {
        if (!f.name || f.name === '') f.name = 'field_' + i;
    });
    document.getElementById('fieldsJson').value = JSON.stringify(fields);
});
formKit.ajaxSubmit(tplForm, { dirty: formKit.trackDirty(tplForm) });

renderFields();

var delForm = document.getElementById('deleteForm');
if (delForm) {
    delForm.addEventListener('submit', function(e) {
        if (!confirm('삭제하시겠습니까?')) e.preventDefault();
    });
}
</script>
{% endblock %}
