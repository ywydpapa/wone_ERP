{% extends "base.html" %}
{% block content %}
<div class="container pb-5">
    <div class="content-card mt-3">
        <div class="card-title">{{ worker.name }} - 급여 마스터 정보</div>
        <form method="post" action="/payroll/{{ worker.id }}/info" class="form-grid cols-2">
{{ csrf_input }}
            <label class="fg-label">기본급</label>
            <div class="fg-field d-flex align-items-center gap-2">
                <input type="number" name="base_salary" class="form-control" min="0" step="10" value="{{ worker.base_salary or 0 }}">
                <span>원</span>
            </div>

            <label class="fg-label">월 소정근로시간</label>
            <div class="fg-field d-flex align-items-center gap-2">
                <input type="number" name="monthly_work_hours" class="form-control" min="0" max="240" value="{{ worker.monthly_work_hours or 0 }}">
                <span>시간</span>
            </div>

            <label class="fg-label">고용보험 가입</label>
            <div class="fg-field">
                <select name="employment_insurance" class="form-select">
                    <option value="1" {% if worker.employment_insurance %}selected{% endif %}>가입</option>
                    <option value="0" {% if not worker.employment_insurance %}selected{% endif %}>미가입</option>
                </select>
            </div>

            <label class="fg-label">부양가족 수</label>
            <div class="fg-field d-flex align-items-center gap-2">
                <input type="number" name="tax_dependent_count" class="form-control" min="1" max="20" value="{{ worker.tax_dependent_count or 1 }}">
                <span>명</span>
            </div>

            <label class="fg-label">8세 이상 20세 이하 자녀 수</label>
            <div class="fg-field d-flex align-items-center gap-2">
                <input type="number" name="tax_child_count" class="form-control" min="0" max="20" value="{{ worker.tax_child_count or 0 }}">
                <span>명</span>
            </div>

            <label class="fg-label">원천징수 비율</label>
            <div class="fg-field">
                <select name="tax_rate" class="form-select">
                    <option value="80" {% if worker.tax_rate == 80 %}selected{% endif %}>80%</option>
                    <option value="100" {% if not worker.tax_rate or worker.tax_rate == 100 %}selected{% endif %}>100%</option>
                    <option value="120" {% if worker.tax_rate == 120 %}selected{% endif %}>120%</option>
                </select>
            </div>

            <label class="fg-label">은행명</label>
            <div class="fg-field"><input type="text" name="bank_name" class="form-control" value="{{ worker.bank_name or '' }}" placeholder="예: 국민은행"></div>

            <label class="fg-label">계좌번호</label>
            <div class="fg-field">
                <input type="text" name="bank_account" class="form-control" placeholder="000-000000-00-000">
                {% if acct_masked %}<div class="form-text text-nowrap">현재 {{ acct_masked }}. 변경 시에만 입력</div>{% endif %}
            </div>

            {% if error %}
            <div class="fg-field fg-wide text-danger small">{{ error }}</div>
            {% endif %}

            <div class="fg-field fg-wide d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm">저장</button>
                <a href="/payroll/{{ worker.id }}" class="btn btn-outline-secondary btn-sm">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
