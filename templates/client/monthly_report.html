{% extends "base.html" %}
{% block content %}
<div class="content-card mt-3">
    <div class="card-title">
        <span>월간 증빙 리포트</span>
        <span class="text-muted small ms-2">{{ company_name }}</span>
    </div>

    {% if not reports %}
    <p class="text-muted py-2">발행된 리포트가 없습니다.</p>
    {% else %}
    <div class="table-responsive">
        <table class="table table-sm mb-0">
            <thead>
                <tr>
                    <th>기간</th>
                    <th>생성일</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for r in reports %}
                <tr>
                    <td>{{ r.year }}년 {{ r.month }}월</td>
                    <td>{{ (r.created_at or '')[:10] }}</td>
                    <td>
                        <a href="/client/monthly-report/{{ r.year }}/{{ r.month }}" class="btn btn-sm btn-outline-primary">상세보기</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endif %}
</div>
{% endblock %}
