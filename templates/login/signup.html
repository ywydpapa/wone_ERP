<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - WONE ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #eef4fb;
            --dark-blue: #0a2540;
            --text-color: #333333;
            --gray-bg: #f8f9fa;
        }
        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-color);
            background-color: var(--gray-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }
        .login-wrapper { width: 100%; max-width: 450px; padding: 20px; }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .brand-logo {
            font-weight: 900; font-size: 2.5rem; color: var(--dark-blue);
            text-align: center; text-decoration: none; display: block; margin-bottom: 5px;
        }
        .brand-logo span { color: var(--primary-blue); }
        .login-title {
            text-align: center; color: #666; font-weight: 600;
            font-size: 1.1rem; margin-bottom: 30px;
        }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%); color: #adb5bd; font-size: 1.1rem;
        }
        .form-control-lg {
            border-radius: 12px; font-size: 1rem;
            padding: 16px 20px 16px 50px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
        }
        .form-control-lg:focus {
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            border-color: var(--primary-blue);
            background-color: #ffffff;
        }
        .form-select-lg {
            border-radius: 12px; font-size: 1rem;
            padding: 16px 20px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
        }
        .btn-primary-custom {
            background-color: var(--primary-blue); color: white;
            border-radius: 12px; padding: 15px; font-weight: 700;
            font-size: 1.1rem; width: 100%; border: none;
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.2);
        }
        .btn-primary-custom:hover {
            background-color: #004494; color: white; transform: translateY(-2px);
        }
        .link-custom { color: var(--primary-blue); text-decoration: none; font-weight: 600; }
        .link-custom:hover { color: #004494; text-decoration: underline; }
        .back-to-home {
            display: block; text-align: center; margin-top: 20px;
            color: #999; text-decoration: none; font-size: 0.9rem;
        }
        .back-to-home:hover { color: var(--text-color); }
        .agree-box {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 20px;
            background: #f8fafc;
            margin-bottom: 20px;
        }
        .agree-all-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid #e2e8f0;
        }
        .agree-all-row label {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a202c;
            cursor: pointer;
            margin: 0;
        }
        .agree-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .agree-item:last-child { margin-bottom: 0; }
        .agree-item label {
            flex: 1;
            font-size: 0.9rem;
            color: #4a5568;
            cursor: pointer;
            margin: 0;
        }
        .agree-item .badge-required {
            font-size: 0.75rem;
            color: #0056b3;
            font-weight: 700;
        }
        .agree-item .badge-optional {
            font-size: 0.75rem;
            color: #718096;
        }
        .agree-link {
            font-size: 0.8rem;
            color: #0056b3;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .agree-link:hover { text-decoration: underline; }
        .form-check-input { cursor: pointer; }
        .agree-error {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 14px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>W</span>ONE ERP</a>
        <div class="login-title">새 계정 만들기</div>

        {% if error == 'dup' %}
        <div class="alert alert-danger py-2 small mb-3">이미 사용 중인 아이디입니다. 다른 아이디를 사용해 주세요.</div>
        {% elif error == 'consent' %}
        <div class="alert alert-danger py-2 small mb-3">필수 약관에 동의해 주세요.</div>
        {% endif %}

        <form action="/signup" method="post">
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="name" class="form-control form-control-lg" placeholder="이름" required>
                <i class="fas fa-id-card"></i>
            </div>
            <div class="mb-4">
                <select name="dept" class="form-select form-select-lg">
                    <option value="경영지원팀">경영지원팀</option>
                    <option value="개발팀">개발팀</option>
                    <option value="디자인팀">디자인팀</option>
                    <option value="영업팀">영업팀</option>
                    <option value="생산팀">생산팀</option>
                    <option value="구매팀">구매팀</option>
                    <option value="재무팀">재무팀</option>
                </select>
            </div>
            <div class="agree-box">
                <div class="agree-all-row">
                    <input class="form-check-input" type="checkbox" id="agreeAll">
                    <label for="agreeAll">전체 동의</label>
                </div>
                <div class="agree-item">
                    <input class="form-check-input agree-required" type="checkbox" id="agreeTerms" name="agree_terms" value="1">
                    <label for="agreeTerms"><span class="badge-required">[필수]</span> 이용약관 동의</label>
                    <a href="/terms" target="_blank" class="agree-link">보기</a>
                </div>
                <div class="agree-item">
                    <input class="form-check-input agree-required" type="checkbox" id="agreePrivacy" name="agree_privacy" value="1">
                    <label for="agreePrivacy"><span class="badge-required">[필수]</span> 개인정보 수집·이용 동의</label>
                    <a href="/privacy" target="_blank" class="agree-link">보기</a>
                </div>
                <div class="agree-item">
                    <input class="form-check-input" type="checkbox" id="agreeMarketing" name="agree_marketing" value="1">
                    <label for="agreeMarketing"><span class="badge-optional">[선택]</span> 마케팅 정보 수신 동의</label>
                </div>
            </div>
            <p class="agree-error" id="agreeError">이용약관 및 개인정보 수집·이용에 동의해 주세요.</p>
            <button type="submit" class="btn btn-primary-custom">가입하기</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted" style="font-size: 0.95rem;">이미 계정이 있으신가요?</span>
            <a href="/login" class="link-custom ms-1">로그인</a>
        </div>
        <div class="text-center mt-2 small text-muted">
            비밀번호를 잊으셨나요? 관리자에게 문의하세요
        </div>
    </div>
    <a href="/login" class="back-to-home"><i class="fas fa-arrow-left me-1"></i> 로그인으로 돌아가기</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const agreeAll = document.getElementById('agreeAll');
    const requiredBoxes = document.querySelectorAll('.agree-required');
    const agreeMarketing = document.getElementById('agreeMarketing');
    const allBoxes = [...requiredBoxes, agreeMarketing];
    const agreeError = document.getElementById('agreeError');

    agreeAll.addEventListener('change', function () {
        allBoxes.forEach(cb => cb.checked = this.checked);
    });

    allBoxes.forEach(cb => {
        cb.addEventListener('change', function () {
            agreeAll.checked = allBoxes.every(c => c.checked);
        });
    });

    document.querySelector('form').addEventListener('submit', function (e) {
        const allRequired = [...requiredBoxes].every(cb => cb.checked);
        if (!allRequired) {
            e.preventDefault();
            agreeError.style.display = 'block';
            agreeError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            agreeError.style.display = 'none';
        }
    });
})();
</script>
</body>
</html>
