<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - WONE ERP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #eef4fb;
            --dark-blue: #0a2540;
            --text-color: #333333;
            --gray-bg: #f8f9fa;
        }
        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-color);
            background-color: var(--gray-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .brand-logo {
            font-weight: 900;
            font-size: 2.5rem;
            color: var(--dark-blue);
            text-align: center;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .brand-logo span { color: var(--primary-blue); }
        .login-title {
            text-align: center;
            color: #666;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .form-control-lg {
            border-radius: 12px;
            font-size: 1rem;
            padding: 16px 20px 16px 50px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
            transition: all 0.3s;
        }
        .form-control-lg:focus {
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            border-color: var(--primary-blue);
            background-color: #ffffff;
        }
        .input-icon-wrapper:focus-within i { color: var(--primary-blue); }
        .btn-primary-custom {
            background-color: var(--primary-blue);
            color: white;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            border: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.2);
        }
        .btn-primary-custom:hover {
            background-color: #004494;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 86, 179, 0.3);
        }
        .form-check-input:checked {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        .link-custom {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .link-custom:hover { color: #004494; text-decoration: underline; }
        .back-to-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-to-home:hover { color: var(--text-color); }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>W</span>ONE ERP</a>
        <div class="login-title">ERP 시스템에 오신 것을 환영합니다</div>

        <div class="alert alert-info py-2 small mb-3">
            <i class="fas fa-info-circle me-1"></i>테스트 계정 (비밀번호: <strong>1234</strong>)
            <div class="mt-1" style="line-height:1.8">
                <span class="badge bg-primary">운영팀</span> admin &nbsp;
                <span class="badge bg-success">근로자</span> user1 &nbsp;
                <span class="badge bg-warning text-dark">고객사</span> client1
            </div>
        </div>

        <form action="/login_check" method="post">
            {% if error %}
            <div class="alert alert-danger py-2 small mb-3">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            {% endif %}
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-4 input-icon-wrapper">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.95rem;">
                        로그인 유지
                    </label>
                </div>
                <span class="text-muted small">비밀번호 찾기 → 관리자 문의</span>
            </div>
            <button type="submit" class="btn btn-primary-custom">로그인</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted" style="font-size: 0.95rem;">계정이 없으신가요?</span>
            <a href="/signup" class="link-custom ms-1">회원가입</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
