<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - WONE ERP</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background-color: var(--gray-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .brand-logo {
            font-weight: 900;
            font-size: 2.5rem;
            color: var(--dark-blue);
            text-align: center;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .brand-logo span { color: var(--primary-blue); }
        .login-title {
            text-align: center;
            color: #666;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .form-control-lg {
            border-radius: 12px;
            font-size: 1rem;
            padding: 16px 20px 16px 50px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
            transition: all 0.3s;
        }
        .form-control-lg:focus {
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            border-color: var(--primary-blue);
            background-color: #ffffff;
        }
        .input-icon-wrapper:focus-within i { color: var(--primary-blue); }
        .btn-primary-custom {
            background-color: var(--primary-blue);
            color: white;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            border: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.2);
        }
        .btn-primary-custom:hover {
            background-color: #004494;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 86, 179, 0.3);
        }
        .form-check-input:checked {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        .link-custom {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .link-custom:hover { color: #004494; text-decoration: underline; }
        .test-row:hover { background-color: #f0f4ff; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>W</span>ONE ERP</a>
        <div class="login-title">장애인 고용 통합관리 시스템</div>

        <form action="/login_check" method="post">
            {% if error %}
            <div class="alert alert-danger py-2 small mb-3">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            {% endif %}
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-4 input-icon-wrapper">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.95rem;">
                        로그인 유지
                    </label>
                </div>
                <span class="text-muted small">비밀번호 분실 시 관리자 문의</span>
            </div>
            <button type="submit" class="btn btn-primary-custom">로그인</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted" style="font-size: 0.95rem;">계정이 없으신가요?</span>
            <a href="/signup" class="link-custom ms-1">회원가입</a>
        </div>

        <hr class="my-4" style="border-color:#e9ecef;">
        <div class="text-center">
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-4" type="button" data-bs-toggle="collapse" data-bs-target="#testAccounts">
                <i class="fas fa-flask me-1"></i>테스트 계정 확인
            </button>
        </div>
        <div class="collapse mt-3" id="testAccounts">
            <div class="small">
                <p class="text-muted mb-2" style="font-size:0.8rem;">비밀번호는 모두 <strong>1234</strong> 입니다.</p>
                <table class="table table-sm mb-0" style="font-size:0.82rem;">
                    <thead class="table-light">
                        <tr><th>역할</th><th>아이디</th><th>설명</th></tr>
                    </thead>
                    <tbody>
                        <tr class="test-row" data-user="admin"><td>관리자</td><td><code>admin</code></td><td>플랫폼 관리</td></tr>
                        <tr class="test-row" data-user="client1"><td>고객사</td><td><code>client1</code></td><td>한빛전자 담당자</td></tr>
                        <tr class="test-row" data-user="hanyang_mgr"><td>고객사</td><td><code>hanyang_mgr</code></td><td>한양정밀 담당자</td></tr>
                        <tr class="test-row" data-user="kim_sujin"><td>근로자</td><td><code>kim_sujin</code></td><td>데이터처리팀</td></tr>
                        <tr class="test-row" data-user="na_hyunwoo"><td>근로자</td><td><code>na_hyunwoo</code></td><td>경리팀</td></tr>
                    </tbody>
                </table>
                <p class="text-muted mt-2 mb-0" style="font-size:0.75rem;">행을 클릭하면 자동 입력됩니다.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.test-row').forEach(function(row) {
    row.style.cursor = 'pointer';
    row.addEventListener('click', function() {
        document.querySelector('input[name="username"]').value = this.dataset.user;
        document.querySelector('input[name="password"]').value = '1234';
    });
});
</script>
</body>
</html>
