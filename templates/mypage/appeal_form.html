{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-lg-6">
        <div class="content-card">
            <div class="card-title">소명서 작성</div>
            <div class="mb-3 p-3 bg-light rounded">
                <div class="row text-center">
                    <div class="col-4">
                        <span class="text-muted small">날짜</span>
                        <div class="fw-600">{{ att.work_date }}</div>
                    </div>
                    <div class="col-4">
                        <span class="text-muted small">출근 시각</span>
                        <div class="fw-600">{{ att.clock_in[:5] if att.clock_in else '-' }}</div>
                    </div>
                    <div class="col-4">
                        <span class="text-muted small">상태</span>
                        <div>
                            {% if att.status == 'late' %}
                            <span class="status-badge status-pending">지각</span>
                            {% elif att.status == 'early_leave' %}
                            <span class="status-badge status-pending">조퇴</span>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            <form method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-600">사유 구분</label>
                    <select name="appeal_type" class="form-select" required>
                        <option value="">선택</option>
                        {% for k, v in appeal_types.items() %}
                        <option value="{{ k }}">{{ v }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-600">소명 사유</label>
                    <textarea name="appeal_reason" class="form-control" rows="4" placeholder="구체적인 사유를 작성해 주세요"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-600">증빙 자료</label>
                    <input type="file" name="evidence" class="form-control">
                    <div class="form-text">지연확인서, 진료확인서 등 (10MB 이하)</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">제출</button>
                    <a href="/mypage/attendance" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
