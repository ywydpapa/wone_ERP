<!DOCTYPE html>
<html lang="ko">
{% include 'common/header.html' %}
<body>
{% include 'common/topbar.html' %}

<div class="dash-header">
    <div class="container">
        <h2>급여 조회</h2>
        <p>본인 확인 후 급여명세서를 조회할 수 있습니다.</p>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center mt-4">
        <div class="col-md-5">
            <div class="content-card">
                <div class="card-title"><span>본인 확인</span></div>
                <p class="text-muted mb-3">급여명세서는 개인정보 보호를 위해 생년월일 확인 후 열람할 수 있습니다.</p>

                {% if error %}
                <div class="alert alert-danger py-2 small">
                    생년월일이 일치하지 않습니다. 다시 확인해주세요.
                </div>
                {% endif %}

                <form method="post" action="/mypage/payslip/verify">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">생년월일</label>
                        <input type="date" name="birth_date" class="form-control" required
                               placeholder="YYYY-MM-DD">
                        <div class="form-text">예: 1995-03-12</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-lock me-1"></i>확인
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% include 'common/_footer.html' %}
</body>
</html>
